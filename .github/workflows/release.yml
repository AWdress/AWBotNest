name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: 生成镜像标签与元数据
        id: meta
        env:
          IMAGE: docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/awbotnest_v2
          VER: ${{ github.ref_name }}
        run: |
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "tags<<__EOF__"
            echo "${IMAGE}:${VER}"
            # 每个 V2 构建都同步 latest，保证一键安装始终可用。
            echo "${IMAGE}:latest"
            echo "__EOF__"
            echo "labels<<__EOF__"
            echo "org.opencontainers.image.title=awbotnest_v2"
            echo "org.opencontainers.image.version=${VER}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.created=${CREATED}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: 构建并推送版本镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 从 CHANGELOG 提取本版本更新日志
        run: |
          VER="${{ github.ref_name }}"
          NOTES=$(awk -v ver="## $VER" '
            $0 == ver {flag=1; next}
            /^## / && flag {flag=0}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="（本版本未在 CHANGELOG.md 中找到对应条目）"
          fi
          printf '%s\n' "$NOTES" > release_notes.md
      - name: 创建 GitHub Release（失败自动重试）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ github.ref_name }}"
          publish() {
            if gh release view "$VER" >/dev/null 2>&1; then
              if [[ "$VER" == *"_dev" || "$VER" == *"-dev" ]]; then
                gh release edit "$VER" --title "$VER" --notes-file release_notes.md --prerelease
              else
                gh release edit "$VER" --title "$VER" --notes-file release_notes.md --prerelease=false --latest
              fi
            else
              if [[ "$VER" == *"_dev" || "$VER" == *"-dev" ]]; then
                gh release create "$VER" --title "$VER" --notes-file release_notes.md --prerelease
              else
                gh release create "$VER" --title "$VER" --notes-file release_notes.md --latest
              fi
            fi
          }
          for i in 1 2 3 4 5; do
            if publish; then
              echo "Release 发布成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次发布失败，15 秒后重试…"
            sleep 15
          done
          exit 1
