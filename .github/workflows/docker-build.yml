name: docker-build

on:
  push:
    branches: [v2]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "install.sh"
      - "**/*.py"
      - "frontend/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装后端依赖
        run: pip install -r requirements.txt
      - name: 校验 Python 源码语法
        run: python -m compileall -q awbotnest plugins/_TEMPLATE.py scripts/export_openapi.py
      - name: 校验一键安装脚本语法
        run: bash -n install.sh
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 校验 OpenAPI 类型同步
        working-directory: frontend
        run: |
          npm run codegen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - name: 构建前端
        working-directory: frontend
        run: npm run build

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 构建镜像（仅验证，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: awbotnest_v2:ci
          cache-from: type=gha,scope=awbotnest-protected-${{ matrix.arch }}
          cache-to: type=gha,scope=awbotnest-protected-${{ matrix.arch }},mode=min
      - name: 校验镜像架构
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          ACTUAL_PLATFORM=$(docker image inspect awbotnest_v2:ci --format '{{.Os}}/{{.Architecture}}')
          test "$ACTUAL_PLATFORM" = "$EXPECTED_PLATFORM"
      - name: 验证编译镜像启动与就绪
        run: |
          # Disposable container: no credentials, external network or host data.
          trap 'docker rm -fv awbotnest-ci >/dev/null 2>&1 || true' EXIT
          for STARTUP in default legacy; do
            if [ "$STARTUP" = default ]; then
              docker run -d --network none --name awbotnest-ci awbotnest_v2:ci
            else
              # Reproduce both ENTRYPOINT and CMD retained by old deployments.
              docker run -d --network none --name awbotnest-ci --entrypoint /usr/bin/tini awbotnest_v2:ci \
                -g -- xvfb-run -a -e /dev/stderr -s '-screen 0 1920x1080x24 -nolisten tcp' python -m awbotnest.main
            fi
            READY=false
            for ATTEMPT in $(seq 1 30); do
              if docker exec awbotnest-ci python -c "import json, urllib.request; result = json.load(urllib.request.urlopen('http://127.0.0.1:18001/readyz', timeout=3)); assert result['ok'] and result['components']['scheduler']" >/dev/null 2>&1; then
                READY=true
                break
              fi
              test "$(docker inspect awbotnest-ci --format '{{.State.Running}}')" = true
              sleep 2
            done
            test "$READY" = true
            docker exec -i awbotnest-ci python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path
          import awbotnest
          import awbotnest.main
          from awbotnest import __version__
          assert hasattr(awbotnest, '__compiled__')
          assert __version__ == Path('/app/VERSION').read_text().strip()
          assert hasattr(awbotnest.main, '__compiled__')
          assert sorted(path.name for path in Path('/app/awbotnest').iterdir()) == ['main.py']
          with urllib.request.urlopen('http://127.0.0.1:18001/openapi.json', timeout=3) as response:
              assert json.load(response)['info']['version'] == __version__
          try:
              urllib.request.urlopen('http://127.0.0.1:18001/api/accounts', timeout=3)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('Compiled API did not enforce authentication')
          print('Compiled image startup, readiness and authentication OK')
          PY
            docker stop --time 30 awbotnest-ci
            EXIT_CODE=$(docker inspect awbotnest-ci --format '{{.State.ExitCode}}')
            # Uvicorn re-raises SIGTERM after graceful shutdown on current Python.
            test "$EXIT_CODE" = 0 || test "$EXIT_CODE" = 143
            docker rm -v awbotnest-ci
            echo "${STARTUP} startup OK"
          done
