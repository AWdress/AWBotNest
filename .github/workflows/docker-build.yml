name: docker-build

on:
  push:
    branches: [v2]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "install.sh"
      - "**/*.py"
      - "frontend/**"
      - "sandbox/**"
      - "docker-compose.sandbox.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装后端依赖
        run: pip install -r requirements.txt
      - name: 校验 Python 源码语法
        run: python -m compileall -q awbotnest sandbox plugins/_TEMPLATE.py scripts/export_openapi.py
      - name: 校验一键安装脚本语法
        run: bash -n install.sh
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 校验 OpenAPI 类型同步
        working-directory: frontend
        run: |
          npm run codegen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - name: 构建前端
        working-directory: frontend
        run: npm run build

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 构建镜像（仅验证，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: awbotnest_v2:ci
          cache-from: type=gha,scope=awbotnest-protected-${{ matrix.arch }}
          cache-to: type=gha,scope=awbotnest-protected-${{ matrix.arch }},mode=min
      - name: 校验镜像架构
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          ACTUAL_PLATFORM=$(docker image inspect awbotnest_v2:ci --format '{{.Os}}/{{.Architecture}}')
          test "$ACTUAL_PLATFORM" = "$EXPECTED_PLATFORM"
      - name: 验证编译镜像启动与就绪
        run: |
          # Disposable container: no credentials, external network or host data.
          trap 'docker rm -fv awbotnest-ci >/dev/null 2>&1 || true' EXIT
          for STARTUP in default legacy; do
            if [ "$STARTUP" = default ]; then
              docker run -d --network none --name awbotnest-ci awbotnest_v2:ci
            else
              # Reproduce both ENTRYPOINT and CMD retained by old deployments.
              docker run -d --network none --name awbotnest-ci --entrypoint /usr/bin/tini awbotnest_v2:ci \
                -g -- xvfb-run -a -e /dev/stderr -s '-screen 0 1920x1080x24 -nolisten tcp' python -m awbotnest.main
            fi
            READY=false
            for ATTEMPT in $(seq 1 30); do
              if docker exec awbotnest-ci python -c "import json, urllib.request; result = json.load(urllib.request.urlopen('http://127.0.0.1:18001/readyz', timeout=3)); assert result['ok'] and result['components']['scheduler']" >/dev/null 2>&1; then
                READY=true
                break
              fi
              test "$(docker inspect awbotnest-ci --format '{{.State.Running}}')" = true
              sleep 2
            done
            test "$READY" = true
            docker exec -i awbotnest-ci python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path
          import awbotnest
          import awbotnest.main
          from awbotnest import __version__
          assert hasattr(awbotnest, '__compiled__')
          assert __version__ == Path('/app/VERSION').read_text().strip()
          assert hasattr(awbotnest.main, '__compiled__')
          assert sorted(path.name for path in Path('/app/awbotnest').iterdir()) == ['main.py']
          with urllib.request.urlopen('http://127.0.0.1:18001/openapi.json', timeout=3) as response:
              assert json.load(response)['info']['version'] == __version__
          try:
              urllib.request.urlopen('http://127.0.0.1:18001/api/accounts', timeout=3)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('Compiled API did not enforce authentication')
          print('Compiled image startup, readiness and authentication OK')
          PY
            docker stop --time 30 awbotnest-ci
            EXIT_CODE=$(docker inspect awbotnest-ci --format '{{.State.ExitCode}}')
            # Uvicorn re-raises SIGTERM after graceful shutdown on current Python.
            test "$EXIT_CODE" = 0 || test "$EXIT_CODE" = 143
            docker rm -v awbotnest-ci
            echo "${STARTUP} startup OK"
          done

  sandbox-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 构建隔离执行镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile.runner
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: awbotnest-assistant-runner:local
          cache-from: type=gha,scope=assistant-runner-${{ matrix.arch }}
          cache-to: type=gha,scope=assistant-runner-${{ matrix.arch }},mode=min
      - name: 构建沙箱管理服务（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile.broker
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: awbotnest-assistant-broker:local
      - name: 验证真实容器隔离、浏览器、文件与回收
        run: |
          # Disposable CI credentials and containers only. No system data,
          # account, plugin directory or internet access is mounted in a runner.
          TOKEN_DIR=$(mktemp -d "${RUNNER_TEMP}/assistant-secret.XXXXXX")
          TOKEN_FILE="${TOKEN_DIR}/token"
          python -c 'import secrets,sys; from pathlib import Path; Path(sys.argv[1]).write_text(secrets.token_urlsafe(32))' "$TOKEN_FILE"
          # The capability-free broker cannot override a host-owned 0600
          # file. Its parent is private; the container gets only this file.
          chmod 0444 "$TOKEN_FILE"
          cleanup() {
            RESULT=$?
            if [ "$RESULT" -ne 0 ]; then
              docker logs --tail 100 awbn-sandbox-ci 2>&1 || true
            fi
            docker stop -t 35 awbn-sandbox-ci >/dev/null 2>&1 || true
            docker rm -fv awbn-sandbox-ci >/dev/null 2>&1 || true
            rm -f "$TOKEN_FILE"
            rmdir "$TOKEN_DIR"
            return "$RESULT"
          }
          trap cleanup EXIT
          docker run -d --name awbn-sandbox-ci --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 64 --memory 256m \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock,readonly \
            --mount "type=bind,src=${TOKEN_FILE},dst=/run/secrets/assistant_sandbox_token,readonly" \
            awbotnest-assistant-broker:local
          for ATTEMPT in $(seq 1 20); do
            if docker exec awbn-sandbox-ci python -c "import urllib.request; from pathlib import Path; r=urllib.request.Request('http://127.0.0.1:8765/v1/health',headers={'Authorization':'Bearer '+Path('/run/secrets/assistant_sandbox_token').read_text()}); urllib.request.urlopen(r,timeout=2)" >/dev/null 2>&1; then
              break
            fi
            test "$(docker inspect awbn-sandbox-ci --format '{{.State.Running}}')" = true
            sleep 1
          done
          docker exec -i awbn-sandbox-ci python - <<'PY'
          import base64
          import json
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path
          from uuid import uuid4

          token = Path('/run/secrets/assistant_sandbox_token').read_text()
          session = uuid4().hex
          def request(path, method='GET', body=None, auth=True):
              headers = {'Authorization': 'Bearer ' + token} if auth else {}
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request('http://127.0.0.1:8765' + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=35) as response:
                  return json.load(response)
          def execute(operation, arguments, request_id=None):
              result = request('/v1/execute', 'POST', {'session_id': session, 'operation': operation,
                  'arguments': arguments, 'request_id': request_id or uuid4().hex})
              assert result['ok'], result.get('error', 'operation failed')
              return result['result']
          try:
              request('/v1/health', auth=False)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('Broker accepted unauthenticated access')
          try:
              assert request('/v1/health')['protocol'] == 1
              request_id = uuid4().hex
              result = execute('python', {'code': 'import os; print(6*7); assert os.getuid()==1000'}, request_id)
              assert result['stdout'].strip() == '42' and result['exit_code'] == 0
              try:
                  execute('python', {'code': 'print(6*7)'}, request_id)
              except urllib.error.HTTPError as error:
                  assert error.code == 409
              else:
                  raise AssertionError('Broker replayed an execution request')
              execute('write_file', {'path': 'notes/result.txt', 'content': 'isolated 42'})
              assert execute('read_file', {'path': 'notes/result.txt'})['content'] == 'isolated 42'
              execute('browser', {'action': 'set_content', 'html': '<button id="answer" onclick="this.textContent=42">Calculate</button>'})
              execute('browser', {'action': 'click', 'selector': '#answer'})
              assert '42' in execute('browser', {'action': 'snapshot'})['text']
              screenshot = execute('browser', {'action': 'screenshot'})
              assert screenshot['mime_type'] == 'image/jpeg'
              assert base64.b64decode(screenshot['data_base64'], validate=True).startswith(b'\xff\xd8\xff')
              identifiers = subprocess.check_output(['docker', 'ps', '-q', '--filter', 'label=awbotnest.sandbox.protocol=1']).decode().split()
              assert len(identifiers) == 1
              config = json.loads(subprocess.check_output(['docker', 'inspect', identifiers[0]]))[0]
              isolation = config['HostConfig']
              assert isolation['NetworkMode'] == 'none' and isolation['ReadonlyRootfs']
              assert isolation['Memory'] == 512*1024*1024 and isolation['PidsLimit'] == 128
              assert config['Config']['User'] == '1000:1000'
              assert not [m for m in config['Mounts'] if m['Type'] in {'bind', 'volume'}]
              assert not isolation['Privileged'] and 'ALL' in isolation['CapDrop']
          finally:
              assert request('/v1/sessions/' + session, 'DELETE')['deleted']
          remaining = subprocess.check_output(['docker', 'ps', '-aq', '--filter', 'label=awbotnest.sandbox.protocol=1']).decode().strip()
          assert not remaining, 'Session container survived explicit cleanup'
          print('Isolated runner execution, browser, authentication, replay prevention and cleanup OK')
          PY
