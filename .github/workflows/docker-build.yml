name: docker-build

on:
  push:
    branches: [v2]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "install.sh"
      - "**/*.py"
      - "frontend/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装后端依赖
        run: pip install -r requirements.txt
      - name: 校验 Python 源码语法
        run: python -m compileall -q awbotnest plugins/_TEMPLATE.py scripts/export_openapi.py
      - name: 校验一键安装脚本语法
        run: bash -n install.sh
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 校验 OpenAPI 类型同步
        working-directory: frontend
        run: |
          npm run codegen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - name: 构建前端
        working-directory: frontend
        run: npm run build

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 构建镜像（仅验证，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: awbotnest_v2:ci
          cache-from: type=gha,scope=awbotnest-${{ matrix.arch }}
          cache-to: type=gha,scope=awbotnest-${{ matrix.arch }},mode=max
      - name: 校验镜像架构
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          ACTUAL_PLATFORM=$(docker image inspect awbotnest_v2:ci --format '{{.Os}}/{{.Architecture}}')
          test "$ACTUAL_PLATFORM" = "$EXPECTED_PLATFORM"
